<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMSON GitHub Pages Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            text-align: center;
        }

        h1 {
            color: #005a9c;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            background: #f5f5f5;
        }
    </style>
</head>
<body>
    <h1>GitHub Pages werkt!</h1>

    <div class="card">
        <p>
            Deze pagina wordt gehost vanuit de SAMSON repository.
        </p>

        <p>
            Tijdstip test:
            <span id="timestamp"></span>
        </p>
    </div>

    <script>
        document.getElementById("timestamp").textContent =
            new Date().toLocaleString();
    </script>
</body>
</html>
